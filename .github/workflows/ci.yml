name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Package names rot on upstream's schedule, not ours, so check runs
    # whether or not anyone has touched the repo.
    - cron: "17 6 * * 1"

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -race

  validate:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      # Offline: schema and referential integrity only.
      - run: go run ./cmd/macwtf validate --manifest-dir .

  check:
    # Verifies every package name still resolves upstream. Allowed to fail the
    # job loudly, since a broken name means a broken install for a user.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - run: go run ./cmd/macwtf check --manifest-dir . --quiet
