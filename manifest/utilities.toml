# Utilities and desktop quality of life.
#
# These carry the TCC problem. macOS will not let any installer grant these
# permissions programmatically — without MDM, a human has to click them in
# System Settings. Collecting them into one end-of-run checklist, with the exact
# pane named per tool, is the single highest-value thing macWTF does.

[[tool]]
id = "rectangle"
name = "Rectangle"
description = "Move and resize windows with keyboard shortcuts and snap areas"
category = "utilities"
license = "free"
homepage = "https://rectangleapp.com"
[tool.macos]
backend = "cask"
package = "rectangle"
app_path = "/Applications/Rectangle.app"
tcc_permissions = ["accessibility"]
verify_cmd = "test -d '/Applications/Rectangle.app'"
notes = "Cannot move a single window until Accessibility is granted. It will prompt on first launch, but the toggle still has to be flipped by hand."

[[tool]]
id = "alt-tab"
name = "AltTab"
description = "Windows-style alt-tab window switcher with live previews"
category = "utilities"
license = "free"
homepage = "https://alt-tab-macos.netlify.app"
[tool.macos]
backend = "cask"
package = "alt-tab"
app_path = "/Applications/AltTab.app"
tcc_permissions = ["accessibility", "screen-recording"]
verify_cmd = "test -d '/Applications/AltTab.app'"
notes = "Needs Accessibility to switch windows and Screen Recording to draw the thumbnail previews. With only Accessibility granted it works but shows blank tiles, which looks like a bug and is not."

