# Security: network and internal.
#
# aircrack-ng below has no [tool.macos] block. It is a real catalogue entry that
# KaliWTF and WindowsWTF will use, and macWTF never loads or displays it — the
# tool simply is not part of the macOS catalogue. That is the mechanism that
# replaces the old linux_only flag.

[[tool]]
id = "wireshark"
name = "Wireshark"
description = "Graphical network protocol analyzer"
category = "sec-network"
license = "free"
homepage = "https://www.wireshark.org"
conflicts_with = ["tshark"]
[tool.macos]
backend = "cask"
package = "wireshark-app"
app_path = "/Applications/Wireshark.app"
verify_cmd = "test -d '/Applications/Wireshark.app'"
manual_steps = [
  "The cask installs ChmodBPF, which needs an admin password during install and sets up the access_bpf group that grants packet-capture rights.",
  "Log out and back in after installing so your membership of access_bpf takes effect — without it Wireshark will list no capture interfaces.",
  "Verify with: dscl . -read /Groups/access_bpf GroupMembership",
]
notes = "Homebrew renamed this cask from 'wireshark' to 'wireshark-app'; the 'wireshark' formula is now the CLI-only build."
[tool.kali]
backend = "apt"
package = "wireshark"
[tool.windows]
backend = "winget"
package = "WiresharkFoundation.Wireshark"

[[tool]]
id = "tshark"
name = "tshark"
description = "Wireshark's command-line analyzer, without the GUI"
category = "sec-network"
license = "free"
homepage = "https://www.wireshark.org"
conflicts_with = ["wireshark"]
[tool.macos]
backend = "brew"
package = "wireshark"
verify_cmd = "command -v tshark"
notes = "Pick this or the Wireshark cask, not both — they ship the same binaries and will fight over the symlinks."
[tool.kali]
backend = "apt"
package = "tshark"

[[tool]]
id = "bettercap"
name = "bettercap"
description = "Network attack and monitoring framework"
category = "sec-network"
license = "free"
homepage = "https://www.bettercap.org"
[tool.macos]
backend = "brew"
package = "bettercap"
verify_cmd = "command -v bettercap"
manual_steps = ["Requires sudo for raw socket and packet injection access."]
notes = "Ethernet and Bluetooth modules work. The WiFi module needs monitor mode and is therefore effectively unusable on the internal card."
[tool.kali]
backend = "apt"
package = "bettercap"

# No [tool.macos] block: capture needs monitor mode, which Apple removed from
# the internal card after Big Sur, and no third-party USB adapter has working
# monitor-mode drivers on Apple Silicon. Not a macOS tool, so macWTF does not
# carry it.
[[tool]]
id = "aircrack-ng"
name = "aircrack-ng"
description = "WiFi security auditing and WEP/WPA cracking suite"
category = "sec-network"
license = "free"
homepage = "https://www.aircrack-ng.org"
[tool.kali]
backend = "apt"
package = "aircrack-ng"
notes = "Preinstalled on Kali. Needs an adapter with monitor mode support."
[tool.windows]
backend = "curl"
package = "https://www.aircrack-ng.org/downloads.html"
notes = "Windows build is limited; capture requires a compatible adapter and driver."
