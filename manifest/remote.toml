# remote
#
# Imported from the draft catalogue. Package names are guesses and
# some will be wrong; `macwtf check` finds them.

[[tool]]
id = "rustdesk"
name = "RustDesk"
description = "Self-hostable relay, open source"
category = "remote"
license = "free"
[tool.macos]
backend = "cask"
package = "rustdesk"

[[tool]]
id = "chrome-remote-desktop"
name = "Chrome Remote Desktop"
description = "Requires Chrome + host installer + TCC"
category = "remote"
license = "free"
[tool.macos]
backend = "manual"
package = "chrome-remote-desktop"
tcc_permissions = ["accessibility"]
unverified = true

