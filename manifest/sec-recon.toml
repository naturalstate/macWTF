# Security: recon and enumeration.

[[tool]]
id = "nmap"
name = "Nmap"
description = "Network discovery and port scanning"
category = "sec-recon"
license = "free"
homepage = "https://nmap.org"
[tool.macos]
backend = "brew"
package = "nmap"
verify_cmd = "command -v nmap"
manual_steps = [
  "SYN scans (-sS), OS detection (-O) and traceroute need root: run them with sudo. Unprivileged nmap falls back to TCP connect scans, which are slower and noisier.",
]
notes = "Installs the NSE script library alongside the binary."
[tool.kali]
backend = "apt"
package = "nmap"
notes = "Preinstalled on Kali."
[tool.windows]
backend = "winget"
package = "Insecure.Nmap"

[[tool]]
id = "masscan"
name = "masscan"
description = "Asynchronous TCP port scanner for very large address ranges"
category = "sec-recon"
license = "free"
homepage = "https://github.com/robertdavidgraham/masscan"
notes = "Rate-limit deliberately. Default rates will saturate a link and trip IDS."
[tool.macos]
backend = "brew"
package = "masscan"
verify_cmd = "command -v masscan"
manual_steps = ["Requires sudo for raw socket access on macOS."]
[tool.kali]
backend = "apt"
package = "masscan"

[[tool]]
id = "rustscan"
name = "RustScan"
description = "Fast port scanner that hands open ports to nmap for service detection"
category = "sec-recon"
license = "free"
homepage = "https://github.com/bee-san/RustScan"
requires = ["nmap"]
notes = "Pipes results into nmap, so nmap is a genuine dependency rather than a suggestion."
[tool.macos]
backend = "brew"
package = "rustscan"
verify_cmd = "command -v rustscan"
[tool.kali]
backend = "cargo"
package = "rustscan"

