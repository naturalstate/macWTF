# Security: recon and enumeration.

[[tool]]
id = "nmap"
name = "Nmap"
description = "Network discovery and port scanning"
category = "sec-recon"
license = "free"
homepage = "https://nmap.org"
[tool.macos]
backend = "brew"
package = "nmap"
verify_cmd = "command -v nmap"
manual_steps = [
  "SYN scans (-sS), OS detection (-O) and traceroute need root: run them with sudo. Unprivileged nmap falls back to TCP connect scans, which are slower and noisier.",
]
notes = "Installs the NSE script library alongside the binary."
[tool.kali]
backend = "apt"
package = "nmap"
notes = "Preinstalled on Kali."
[tool.windows]
backend = "winget"
package = "Insecure.Nmap"

[[tool]]
id = "masscan"
name = "masscan"
description = "Asynchronous TCP port scanner for very large address ranges"
category = "sec-recon"
license = "free"
homepage = "https://github.com/robertdavidgraham/masscan"
notes = "Rate-limit deliberately. Default rates will saturate a link and trip IDS."
[tool.macos]
backend = "brew"
package = "masscan"
verify_cmd = "command -v masscan"
manual_steps = ["Requires sudo for raw socket access on macOS."]
[tool.kali]
backend = "apt"
package = "masscan"

[[tool]]
id = "rustscan"
name = "RustScan"
description = "Fast port scanner that hands open ports to nmap for service detection"
category = "sec-recon"
license = "free"
homepage = "https://github.com/bee-san/RustScan"
requires = ["nmap"]
notes = "Pipes results into nmap, so nmap is a genuine dependency rather than a suggestion."
[tool.macos]
backend = "brew"
package = "rustscan"
verify_cmd = "command -v rustscan"
[tool.kali]
backend = "cargo"
package = "rustscan"

[[tool]]
id = "ffuf"
name = "ffuf"
description = "Fast web fuzzer for content and parameter discovery"
category = "sec-recon"
license = "free"
homepage = "https://github.com/ffuf/ffuf"
[tool.macos]
backend = "brew"
package = "ffuf"
verify_cmd = "command -v ffuf"
[tool.kali]
backend = "apt"
package = "ffuf"
[tool.windows]
backend = "go"
package = "github.com/ffuf/ffuf/v2@latest"

[[tool]]
id = "gobuster"
name = "gobuster"
description = "Directory, DNS and vhost brute forcing"
category = "sec-recon"
license = "free"
homepage = "https://github.com/OJ/gobuster"
[tool.macos]
backend = "brew"
package = "gobuster"
verify_cmd = "command -v gobuster"
[tool.kali]
backend = "apt"
package = "gobuster"

[[tool]]
id = "subfinder"
name = "subfinder"
description = "Passive subdomain discovery across dozens of sources"
category = "sec-recon"
license = "free"
homepage = "https://github.com/projectdiscovery/subfinder"
[tool.macos]
backend = "go"
package = "github.com/projectdiscovery/subfinder/v2/cmd/subfinder"
verify_cmd = "command -v subfinder"
notes = "Ships only as a Go module. The /v2 in the path is a module major version, not part of the binary name."
[tool.kali]
backend = "apt"
package = "subfinder"

[[tool]]
id = "httpx"
name = "httpx"
description = "Fast multi-purpose HTTP prober"
category = "sec-recon"
license = "free"
homepage = "https://github.com/projectdiscovery/httpx"
[tool.macos]
backend = "go"
package = "github.com/projectdiscovery/httpx/cmd/httpx"
verify_cmd = "command -v httpx"
notes = "Name collides with the Python httpx library. If you use both, alias one of them."

[[tool]]
id = "theharvester"
name = "theHarvester"
description = "Email, subdomain and name harvesting from public sources"
category = "sec-recon"
license = "free"
homepage = "https://github.com/laramies/theHarvester"
[tool.macos]
backend = "pipx"
package = "theHarvester"
verify_cmd = "command -v theHarvester"
[tool.kali]
backend = "apt"
package = "theharvester"

[[tool]]
id = "wafw00f"
name = "wafw00f"
description = "Identify the web application firewall behind a site"
category = "sec-recon"
license = "free"
homepage = "https://github.com/EnableSecurity/wafw00f"
[tool.macos]
backend = "pipx"
package = "wafw00f"
verify_cmd = "command -v wafw00f"
