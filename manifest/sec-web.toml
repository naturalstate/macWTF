# Security: web application testing.

[[tool]]
id = "burp-suite"
name = "Burp Suite Community"
description = "Intercepting web proxy and application security testing platform"
category = "sec-web"
license = "freemium"
homepage = "https://portswigger.net/burp"
notes = "Community edition throttles the scanner and disables saved projects."
[tool.macos]
backend = "cask"
package = "burp-suite"
app_path = "/Applications/Burp Suite.app"
verify_cmd = "test -d '/Applications/Burp Suite.app'"
manual_steps = [
  "To intercept HTTPS, export Burp's CA certificate from http://burp while the proxy is running, then trust it in Keychain Access (System keychain → Always Trust).",
]
notes = "PortSwigger signs and notarizes the cask, so no quarantine strip is needed."
[tool.kali]
backend = "apt"
package = "burpsuite"
notes = "Preinstalled on Kali."
[tool.windows]
backend = "winget"
package = "PortSwigger.BurpSuite.Community"

[[tool]]
id = "caido"
name = "Caido"
description = "Web security auditing toolkit, lighter alternative to Burp"
category = "sec-web"
license = "freemium"
homepage = "https://caido.io"
notes = "Rust-based. Noticeably lower memory footprint than Burp on large scopes."
[tool.macos]
backend = "cask"
package = "caido"
app_path = "/Applications/Caido.app"
verify_cmd = "test -d '/Applications/Caido.app'"
notes = "Ships a caido-cli binary alongside the app."
[tool.kali]
backend = "curl"
package = "https://caido.io/download"

[[tool]]
id = "mitmproxy"
name = "mitmproxy"
description = "Intercept, modify, replay and save HTTP/S traffic from the terminal"
category = "sec-web"
license = "free"
homepage = "https://mitmproxy.org"
[tool.macos]
backend = "cask"
package = "mitmproxy"
verify_cmd = "command -v mitmproxy"
manual_steps = [
  "On first run mitmproxy writes a CA cert to ~/.mitmproxy. Trust it via Keychain Access, or visit http://mitm.it with the proxy active.",
]
notes = "Was a Homebrew formula historically; it is now distributed as a cask."
[tool.kali]
backend = "apt"
package = "mitmproxy"
[tool.windows]
backend = "winget"
package = "mitmproxy.mitmproxy"

[[tool]]
id = "sqlmap"
name = "sqlmap"
description = "Automated SQL injection detection and exploitation"
category = "sec-web"
license = "free"
homepage = "https://sqlmap.org"
notes = "Aggressive by default. Use --level and --risk deliberately against anything you do not own."
[tool.macos]
backend = "brew"
package = "sqlmap"
verify_cmd = "command -v sqlmap"
[tool.kali]
backend = "apt"
package = "sqlmap"
notes = "Preinstalled on Kali."
