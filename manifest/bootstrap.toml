# bootstrap
#
# Imported from the draft catalogue. Package names are guesses and
# some will be wrong; `macwtf check` finds them.

[[tool]]
id = "xcode-command-line-tools"
name = "Xcode Command Line Tools"
description = "xcode-select --install, prerequisite for everything"
category = "bootstrap"
license = "free"
[tool.macos]
backend = "manual"
package = "xcode-command-line-tools"
unverified = true

[[tool]]
id = "homebrew"
name = "Homebrew"
description = "Detect existing install, don't clobber"
category = "bootstrap"
license = "free"
[tool.macos]
backend = "curl"
package = "homebrew"
unverified = true

