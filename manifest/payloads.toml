# Payload and enumeration collections.
#
# These are cloned rather than installed, and mostly do not run on macOS at all
# — LinPEAS is a Linux enumeration script. That is the point: they are things
# you carry to a target, not things you execute on the machine doing the
# carrying. Having them staged locally is the whole value.

[[tool]]
id = "peass-ng"
name = "PEASS-ng"
description = "Privilege escalation enumeration scripts for Linux, macOS and Windows"
category = "payloads"
license = "free"
homepage = "https://github.com/peass-ng/PEASS-ng"
notes = "LinPEAS, WinPEAS and MacPEAS. Transferred to a target and run there, not run locally."
[tool.macos]
backend = "git"
package = "https://github.com/peass-ng/PEASS-ng.git"
dest = "peass-ng"

[[tool]]
id = "pcredz"
name = "PCredz"
description = "Extract credentials from a pcap or live interface"
category = "payloads"
license = "free"
homepage = "https://github.com/lgandx/PCredz"
[tool.macos]
backend = "git"
package = "https://github.com/lgandx/PCredz.git"
dest = "pcredz"
manual_steps = [
  "Needs Cython and python-libpcap: pip3 install --user Cython python-libpcap",
]

